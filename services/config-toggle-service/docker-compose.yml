services:
  config-toggle-service:
    build: .
    container_name: config-toggle-service
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      API_KEYS: dev-local-key
      CORS_ORIGIN: "*"
      DATA_FILE_PATH: /app/src/data/flags.json
    volumes:
      # Persist flag state across container restarts.
      - flags-data:/app/src/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  flags-data:
