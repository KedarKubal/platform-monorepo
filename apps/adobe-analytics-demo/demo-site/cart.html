<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cart — Northline Goods</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <section class="tight" style="padding-top:40px;">
    <h1 style="font-size:28px;">Your Cart</h1>
    <div id="cart-root"></div>
  </section>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/datalayer.js"></script>
  <script src="js/products-data.js"></script>
  <script src="js/app.js"></script>
  <script>
    function render() {
      const items = window.NLG_cart.cartWithDetails();
      const root = document.getElementById("cart-root");
      if (!items.length) {
        root.innerHTML = '<div class="empty-state"><h2>Your cart is empty</h2><p><a href="plp.html" class="btn secondary">Browse gear</a></p></div>';
        return;
      }
      const rows = items
        .map(
          (i) => `<tr data-sku="${i.sku}">
          <td>${i.name}</td>
          <td>${i.qty}</td>
          <td>$${i.price.toFixed(2)}</td>
          <td>$${(i.price * i.qty).toFixed(2)}</td>
          <td><button class="remove-link" data-sku="${i.sku}">Remove</button></td>
        </tr>`
        )
        .join("");
      root.innerHTML = `
        <table class="cart-table">
          <thead><tr><th>Item</th><th>Qty</th><th>Price</th><th>Subtotal</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        <div class="cart-summary">
          <div class="cart-summary-box">
            <div class="cart-summary-row"><span>Subtotal</span><span>$${window.NLG_cart.cartTotal().toFixed(2)}</span></div>
            <div class="cart-summary-row"><span>Shipping</span><span>Calculated at checkout</span></div>
            <div class="cart-summary-row total"><span>Estimated Total</span><span>$${window.NLG_cart.cartTotal().toFixed(2)}</span></div>
            <a class="btn full" id="checkout-btn" href="checkout.html" style="margin-top:14px;">Checkout</a>
          </div>
        </div>`;

      root.querySelectorAll(".remove-link").forEach((btn) => {
        btn.addEventListener("click", function () {
          const sku = btn.dataset.sku;
          const product = window.NLG_findProduct(sku);
          const removedItem = items.find((i) => i.sku === sku);
          window.NLG_cart.removeFromCart(sku);

          // Tracking plan: event3 Remove from Cart
          const productsString = `${product.category};${product.name};${removedItem.qty};${product.price.toFixed(2)};event3=1;eVar4=${sku}`;
          window.AA.track("cart.remove", { event3: removedItem.qty, eVar4: sku, eVar8: window.digitalData.cart.id, products: productsString });

          document.getElementById("cart-count").textContent = window.NLG_cart.cartCount();
          render();
        });
      });

      document.getElementById("checkout-btn").addEventListener("click", function () {
        // Tracking plan: event4 Checkout Initiated
        window.AA.track("checkout.initiated", { event4: 1, eVar8: window.digitalData.cart.id });
      });
    }

    // Page-load data layer for Cart
    window.digitalData.page.pageName = "Cart";
    window.digitalData.page.section = "Cart";
    window.AA.pageView();
    render();
  </script>
</body>
</html>
