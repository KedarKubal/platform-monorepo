name: dsm_widgetbook
description: Widgetbook catalog app for visual QA of the Flutter DSM components.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  dsm_components:
    path: ../dsm_components
  widgetbook: ^3.10.0
  widgetbook_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  widgetbook_generator: ^3.9.0
