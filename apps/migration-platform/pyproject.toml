[project]
name = "migration-platform"
version = "0.1.0"
description = "ETL pipeline migrating legacy CSV/DB data into a normalized target schema"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pandas>=2.2",
    "psycopg2-binary>=2.9",
    "pydantic>=2.6",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "faker>=24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
