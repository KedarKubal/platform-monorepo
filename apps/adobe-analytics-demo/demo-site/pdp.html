<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product — Northline Goods</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <section class="tight" style="padding-top:40px;" id="pdp-root">
    <!-- populated by script -->
  </section>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/datalayer.js"></script>
  <script src="js/products-data.js"></script>
  <script src="js/app.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const sku = params.get("sku");
    const product = window.NLG_findProduct(sku);
    const root = document.getElementById("pdp-root");

    if (!product) {
      root.innerHTML = '<div class="empty-state"><h2>Product not found</h2><p><a href="plp.html" class="btn secondary">Back to shop</a></p></div>';
      window.digitalData.page.pageName = "404: Product Not Found";
      window.digitalData.page.section = "Error";
      window.digitalData.page.errorCode = "404";
      window.AA.pageView();
    } else {
      root.innerHTML = `
        <div class="pdp-grid">
          <div class="swatch pdp-swatch">${product.image}</div>
          <div class="pdp-info">
            <div class="sku">SKU ${product.sku}</div>
            <h1>${product.name}</h1>
            <div class="price">$${product.price.toFixed(2)}</div>
            <p style="color:var(--text-dim);">${product.blurb}</p>
            <div class="qty-row">
              <label for="qty" style="color:var(--text-dim); font-size:13px;">Qty</label>
              <input type="number" id="qty" value="1" min="1" max="10" />
            </div>
            <button class="btn" id="add-to-cart-btn">Add to Cart</button>
            <p id="add-confirm" style="color:var(--accent-2); font-size:13px; margin-top:10px; display:none;">Added to cart.</p>
          </div>
        </div>`;

      document.getElementById("add-to-cart-btn").addEventListener("click", function () {
        const qty = Math.max(1, parseInt(document.getElementById("qty").value, 10) || 1);
        window.NLG_cart.addToCart(product.sku, qty);

        // Tracking plan: event2 Add to Cart, products string convention
        const productsString = `${product.category};${product.name};${qty};${product.price.toFixed(2)};event2=1;eVar4=${product.sku}`;
        window.AA.track("cart.add", {
          event2: qty,
          eVar4: product.sku,
          eVar8: window.digitalData.cart.id,
          products: productsString,
        });

        document.getElementById("cart-count").textContent = window.NLG_cart.cartCount();
        const confirm = document.getElementById("add-confirm");
        confirm.style.display = "block";
        setTimeout(() => (confirm.style.display = "none"), 2500);
      });

      // Page-load data layer for PDP
      window.digitalData.page.pageName = "PDP: " + product.name;
      window.digitalData.page.section = product.section;
      window.digitalData.product = [
        { name: product.name, sku: product.sku, category: product.category, price: product.price },
      ];
      window.AA.pageView();
    }
  </script>
</body>
</html>
